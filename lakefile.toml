name = "RealQuick"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RealQuick", "Algorithms"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "RealQuick"

[[lean_lib]]
name = "Algorithms"
# Build every submodule under `Algorithms/`; an `Algorithms.lean` umbrella
# module is not required.
globs = ["Algorithms.+"]